<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI Expense Tracker</title>
  <meta name="description" content="Snap a receipt or say what you spent. AI logs it for your books.">
  <meta name="theme-color" content="#f4f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AI Expenses">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
  <input type="file" id="upload-input" accept="image/*,application/pdf" multiple hidden>
  <noscript>This app needs JavaScript turned on.</noscript>
</body>
</html>
